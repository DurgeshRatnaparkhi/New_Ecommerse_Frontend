<div class="order-container">

  <div class="left-section">
    <h2 class="section-title">Select Delivery Address</h2>

    <!-- Address List -->
    <div *ngIf="addresses.length > 0">

      <div *ngFor="let address of addresses"
           (click)="selectedAddressId = address.id"
           [class.selected]="selectedAddressId === address.id"
           class="address-card">

        <div class="radio-section">
          <input type="radio"
                 [checked]="selectedAddressId === address.id" />
        </div>

        <div class="address-details">
          <h4>{{address.fullName}}</h4>
          <p>{{address.street}}</p>
          <p>{{address.city}}, {{address.state}} - {{address.pincode}}</p>
          <p class="mobile">📞 {{address.mobile}}</p>
        </div>

      </div>

      <button class="add-new-btn" (click)="toggleAddressForm()">
        + Add New Address
      </button>

    </div>

    <!-- Address Form -->
    <div *ngIf="showAddressForm" class="address-form">

      <h3>Add New Address</h3>

      <input placeholder="Full Name" [(ngModel)]="newAddress.fullName">
      <input placeholder="Mobile Number" [(ngModel)]="newAddress.mobile">
      <input placeholder="Street Address" [(ngModel)]="newAddress.street">
      <input placeholder="City" [(ngModel)]="newAddress.city">
      <input placeholder="State" [(ngModel)]="newAddress.state">
      <input placeholder="Pincode" [(ngModel)]="newAddress.pincode">

      <button class="save-btn" (click)="saveAddress()">Save Address</button>
    </div>

  </div>

  <!-- Right Section (Order Summary) -->
  <div class="right-section">

    <h3>Order Summary</h3>

    <div *ngFor="let item of cartItems" class="summary-item">
      <span>{{item.productName}} x {{item.quantity}}</span>
      <span>₹{{item.totalPrice}}</span>
    </div>

    <hr>

    <div class="total">
      <span>Total</span>
      <span>₹{{grandTotal}}</span>
    </div>

    <button class="confirm-btn"
            [disabled]="loading"
            (click)="confirmOrder()">
      {{ loading ? 'Placing Order...' : 'Confirm Order' }}
    </button>

  </div>

</div>
