<div class="cart-page" *ngIf="cart">

  <h2 class="title">Your Cart</h2>

  <!-- EMPTY CART -->
  <div *ngIf="cart.items.length === 0" class="empty">
    Your cart is empty
  </div>

  <!-- CART CONTENT -->
  <div class="cart-layout" *ngIf="cart.items.length > 0">

    <!-- LEFT : CART ITEMS -->
    <div class="cart-items">

      <div class="cart-item" *ngFor="let item of cart.items">

        <!-- Product Image -->
        <img
          [src]="'http://localhost:8081/api/public/products/image/' + item.productId"
          alt="product"
        />

        <!-- Product Details -->
        <div class="details">
          <h3>{{ item.productName }}</h3>
          <p>Price: ₹ {{ item.price }}</p>

          <div class="actions">
            <button (click)="decreaseQty(item.productId)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="increaseQty(item.productId)">+</button>
          </div>
        </div>

        <!-- Item Total -->
        <div class="item-total">
          ₹ {{ item.totalPrice }}
        </div>

      </div>

    </div>

    <!-- RIGHT : ORDER SUMMARY -->
    <div class="summary">
      <h3>Order Summary</h3>

      <div class="row">
        <span>Subtotal</span>
        <span>₹ {{ cart.totalAmount }}</span>
      </div>

      <div class="row">
        <span>Delivery</span>
        <span>₹ 0</span>
      </div>

      <hr />

      <div class="row total">
        <span>Total</span>
        <span>₹ {{ cart.totalAmount }}</span>
      </div>

     <button (click)="goToOrderPage()">Order</button>
    </div>

  </div>
</div>
