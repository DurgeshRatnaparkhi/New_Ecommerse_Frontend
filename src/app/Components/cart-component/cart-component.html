<div class="cart-page" *ngIf="cart">

  <h2 class="cart-title">🛒 Your Shopping Cart</h2>

  <div class="cart-container">
     <div *ngIf="cart.items?.length === 0">
  <h3>Your cart is empty</h3>
  <button routerLink="/user">Continue Shopping</button>
</div>

    <!-- LEFT SIDE -->
    <div class="cart-items">

      <div class="cart-card" *ngFor="let item of cart.items">

        <div class="image-box">
          <img
            [src]="'http://localhost:8081/api/public/products/image/' + item.productId"
            alt="product"
          />
        </div>

        <div class="item-details">
          <h3>{{ item.productName }}</h3>
          <p class="price">₹ {{ item.price }}</p>

          <div class="quantity-box">
            <button (click)="decreaseQty(item.productId)">−</button>
            <span>{{ item.quantity }}</span>
            <button (click)="increaseQty(item.productId)">+</button>
          </div>
        </div>

        <div class="item-total">
          ₹ {{ item.totalPrice }}
        </div>

      </div>

    </div>

    <!-- RIGHT SIDE SUMMARY -->
    <div class="cart-summary">

      <h3>Order Summary</h3>

      <div class="summary-row">
        <span>Subtotal</span>
        <span>₹ {{ cart.totalAmount }}</span>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span class="free">Free</span>
      </div>

      <hr>

      <div class="summary-row total">
        <span>Total</span>
        <span>₹ {{ cart.totalAmount }}</span>
      </div>

      
      <button class="checkout-btn" (click)="goToOrderPage()">
        Proceed to Order →
      </button>

    </div>
    

  </div>
 

</div>
