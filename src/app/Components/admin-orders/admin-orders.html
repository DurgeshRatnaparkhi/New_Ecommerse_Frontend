<div class="admin-container">

  <h2>📦 Orders Management</h2>

  <div *ngIf="loading" class="loading">Loading orders...</div>

  <table *ngIf="!loading" class="orders-table">

    <thead>
      <tr>
        <th>#</th>
        <th>User</th>
        <th>Date</th>
        <th>Total</th>
        <th>Status</th>
        <th>Items</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let o of orders; let i = index"
          class="row-animate"
          [style.animationDelay]="i * 0.05 + 's'">

        <td>{{i + 1}}</td>

        <td>{{o.userName}}</td>

        <td>{{o.orderDate | date:'short'}}</td>

        <td class="price">₹ {{o.totalAmount}}</td>

        <td>
          <span class="status" [ngClass]="o.status.toLowerCase()">
            {{o.status}}
          </span>
        </td>

        <td>{{o.items.length}}</td>

        <td class="actions">

          <button (click)="viewOrder(o.orderId)" class="view-btn">
            👁
          </button>

          <select (change)="updateStatus(o.orderId, $event)">
            <option disabled selected>Update</option>
            <option value="SHIPPED">Ship</option>
            <option value="DELIVERED">Deliver</option>
          </select>

        </td>

      </tr>
    </tbody>

  </table>

</div>
