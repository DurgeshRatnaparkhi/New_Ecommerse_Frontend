<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow p-4" style="width: 380px; border-radius: 15px;">
    <h3 class="text-center mb-3">Forgot Password</h3>
    <p class="text-center text-muted mb-4">Enter your email to receive an OTP</p>

    <form [formGroup]="form">
      
      <!-- Email Label -->
      <label class="form-label fw-semibold">Email</label>

      <!-- Email Input -->
      <input
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="Enter email"
        (blur)="form.get('email')?.markAsTouched()"
      >

      <!-- Required Error -->
      <div class="text-danger mt-1"
        *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
        Email is required
      </div>

      <!-- Invalid Email Error -->
      <div class="text-danger mt-1"
        *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
        Enter a valid email
      </div>

      <!-- Send OTP Button -->
      <button class="btn btn-primary w-100 mt-3" (click)="sendOtp()">
        Send OTP
      </button>

      <!-- API Response Message -->
      <p class="text-center mt-3 text-success">{{ message }}</p>

    </form>
  </div>
</div>
