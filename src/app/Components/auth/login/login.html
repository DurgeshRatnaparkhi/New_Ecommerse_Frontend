<div class="container">
  <div class="card">
    <h2>Login</h2>

    <form (ngSubmit)="onSubmit()">
      <input 
        type="email" 
        placeholder="Email" 
        [(ngModel)]="form.email" 
        name="email" 
        required 
      />

      <input 
        type="password" 
        placeholder="Password" 
        [(ngModel)]="form.password" 
        name="password" 
        required 
      />

      <button type="submit">Login</button>
    </form>

    <!-- ⭐ Added Forgot Password link -->
    <p style="margin-top: 10px;">
      <a routerLink="/forgot-password" style="color:#0d6efd; text-decoration:none;">
        Forgot Password?
      </a>
    </p>  

    <p>
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
